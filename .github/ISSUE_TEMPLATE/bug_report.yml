name: Bug report
description: Report a reproducible EvidenceLoop defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve EvidenceLoop. Do not include credentials, tokens, private keys, `.env` contents, customer data, or unrelated private files.
  - type: input
    id: version
    attributes:
      label: EvidenceLoop version
      description: Use a release tag or commit hash.
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, Python version, and invocation method.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe sequence that reproduces the defect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Include relevant exit codes or output after removing all sensitive and private data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I removed credentials, secrets, private paths, and unrelated private data.
          required: true
        - label: I checked for an existing issue describing the same defect.
          required: true
