schema_version: "1.0"
state_file: ".agent/TASK_STATE.json"
evidence_directory: ".agent/EVIDENCE"
lock_file: ".agent/LOCK.json"
smallest_verifiable_action: true
require_real_state_inspection: true
trust_historical_completion_claims: false
acceptance_gate:
  only_done_from: "VERIFYING"
  all_mandatory_results_true: true
terminal_behavior:
  DONE: "read_only"
  BLOCKED: "check_named_unblock_condition_only"
retry_policy:
  first_same_failure: "analyze_and_repair"
  second_same_failure: "recheck_root_cause"
  third_same_failure: "retire_strategy_and_replan"
  three_distinct_failed_strategies: "block_only_when_no_self_service_route_remains"
